<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하위 관리자 - 학생회</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="survey.css">
</head>
<body>

    <header class="site-header">
        <a class="logo" href="index.html">
            <span class="logo-mark">🎓</span>
            <span>학생회</span>
        </a>
        <div id="userArea" class="user-area"></div>
    </header>

    <main>
        <a class="login-back" href="admin.html">← 관리자 페이지</a>

        <section class="panel">
            <h1>하위 관리자 지정</h1>
            <p class="meta">
                지정된 사람은 학번과 비밀번호(처음엔 0000)로 로그인하면 관리자 페이지를 쓸 수 있어요.
                로그인한 뒤 관리자 페이지의 "내 비밀번호 변경"에서 직접 바꿀 수 있어요.
                학교 규정·축제 부스 기능은 아직 없어서 권한만 저장돼요.
                지금은 이 브라우저에만 저장돼서, 다른 기기에서는 적용되지 않아요.
            </p>

            <form id="subAdminForm" autocomplete="off" style="max-width:520px">
                <label for="subAdminName">이름</label>
                <input type="text" id="subAdminName" maxlength="20" placeholder="이름">

                <label for="subAdminId">학번</label>
                <input type="text" id="subAdminId" inputmode="numeric" maxlength="5" placeholder="5자리 학번">

                <label>역할 (둘 다 선택할 수도 있어요)</label>
                <label class="option">
                    <input type="checkbox" id="roleOfficer">
                    <span>학생회 임원 <span class="meta" style="margin:0">— 일정 · 설문조사 · 학교 규정</span></span>
                </label>
                <label class="option">
                    <input type="checkbox" id="roleClub">
                    <span>동아리 부장 <span class="meta" style="margin:0">— 축제 부스 예약</span></span>
                </label>

                <div id="clubBlock" hidden>
                    <label for="clubName">동아리명</label>
                    <input type="text" id="clubName" maxlength="30" placeholder="동아리명">
                </div>

                <div class="row">
                    <button type="submit" class="login-submit" id="subAdminSubmit">지정하기</button>
                    <button type="button" class="secondary-button" id="subAdminCancel" hidden>수정 취소</button>
                </div>
                <p id="subAdminMsg" class="login-error" hidden></p>
            </form>
        </section>

        <section class="panel" style="margin-top:18px">
            <h1 style="font-size:20px">하위 관리자 목록</h1>

            <p id="subAdminEmpty" class="meta">지정된 하위 관리자가 없어요.</p>

            <div id="subAdminTableWrap" class="table-wrap" hidden>
                <table class="people-table">
                    <thead>
                        <tr><th>이름</th><th>학번</th><th>관리자 형태</th><th>관리</th></tr>
                    </thead>
                    <tbody id="subAdminRows"></tbody>
                </table>
            </div>

            <p id="subListMsg" class="login-error" hidden></p>
        </section>
    </main>

    <footer class="site-footer">© 학생회</footer>

    <script src="auth.js"></script>
    <script src="admin.js"></script>
    <script>
        // 권한이 없으면 관리자 페이지로 돌려보냄 (관리자가 아니면 메인으로)
        if (AdminPage.guard("admin.manage")) {
        Auth.renderUserArea(document.getElementById("userArea"));
        const showMsg = AdminPage.showMsg;

            // ---------- 하위 관리자 ----------

            const subForm = document.getElementById("subAdminForm");
            const nameInput = document.getElementById("subAdminName");
            const idInput = document.getElementById("subAdminId");
            const officerBox = document.getElementById("roleOfficer");
            const clubBox = document.getElementById("roleClub");
            const clubBlock = document.getElementById("clubBlock");
            const clubInput = document.getElementById("clubName");
            const submitBtn = document.getElementById("subAdminSubmit");
            const cancelBtn = document.getElementById("subAdminCancel");
            const subMsg = document.getElementById("subAdminMsg");

            const listMsg = document.getElementById("subListMsg");
            const emptyText = document.getElementById("subAdminEmpty");
            const tableWrap = document.getElementById("subAdminTableWrap");
            const rowsBody = document.getElementById("subAdminRows");

            let editingId = null; // 수정 중인 학번 (null이면 새로 지정하는 중)

            const errorText = {
                invalid_id: "잘못된 입력이에요. 존재하지 않는 학번이에요.",
                super_id: "최고 관리자 학번은 하위 관리자로 지정할 수 없어요.",
                duplicate: "이미 하위 관리자로 지정된 학번이에요. 아래 목록에서 수정해 주세요.",
                invalid_name: `이름을 1~${Auth.MAX_NAME}자로 입력해 주세요.`,
                no_role: "역할을 하나 이상 선택해 주세요.",
                no_club: `동아리명을 1~${Auth.MAX_CLUB}자로 입력해 주세요.`,
                not_found: "이미 목록에서 사라진 관리자예요.",
                forbidden: "권한이 없어요.",
                error: "이 브라우저에서는 저장할 수 없어요."
            };

            function resetSubForm() {
                editingId = null;
                subForm.reset();
                idInput.readOnly = false;
                clubBlock.hidden = true;
                submitBtn.textContent = "지정하기";
                cancelBtn.hidden = true;
                subMsg.hidden = true;
            }

            // 숫자만 입력
            idInput.addEventListener("input", () => {
                idInput.value = idInput.value.replace(/\D/g, "");
                subMsg.hidden = true;
            });
            clubBox.addEventListener("change", () => { clubBlock.hidden = !clubBox.checked; });
            cancelBtn.addEventListener("click", resetSubForm);

            subForm.addEventListener("submit", event => {
                event.preventDefault();
                listMsg.hidden = true;

                const data = {
                    name: nameInput.value,
                    officer: officerBox.checked,
                    clubLeader: clubBox.checked,
                    club: clubInput.value
                };

                const wasEditing = editingId !== null;
                const result = wasEditing ? Auth.updateSubAdmin(editingId, data) : Auth.addSubAdmin(idInput.value, data);

                if (result !== "ok") {
                    showMsg(subMsg, errorText[result] || errorText.error, false);
                    if (result === "not_found") { resetSubForm(); renderSubAdmins(); }
                    return;
                }

                const who = data.name.trim();
                resetSubForm();
                showMsg(subMsg, wasEditing
                    ? `${who}님의 정보를 수정했어요.`
                    : `${who}님을 하위 관리자로 지정했어요. 처음 비밀번호는 ${Auth.DEFAULT_PASSWORD}이에요.`, true);
                renderSubAdmins();
            });

            function startEdit(admin) {
                editingId = admin.id;
                nameInput.value = admin.name;
                idInput.value = admin.id;
                idInput.readOnly = true; // 학번은 바꿀 수 없어요 (바꾸려면 해제 후 다시 지정)
                officerBox.checked = admin.officer;
                clubBox.checked = admin.clubLeader;
                clubInput.value = admin.club;
                clubBlock.hidden = !admin.clubLeader;
                submitBtn.textContent = "수정 저장";
                cancelBtn.hidden = false;
                subMsg.hidden = true;
                listMsg.hidden = true;
                subForm.scrollIntoView({ behavior: "smooth", block: "center" });
                nameInput.focus();
            }

            function resetPassword(admin) {
                if (!confirm(`${admin.name}(${admin.id})님의 비밀번호를 ${Auth.DEFAULT_PASSWORD}으로 초기화할까요?`)) return;
                const result = Auth.resetSubAdminPassword(admin.id);
                showMsg(listMsg, result === "ok"
                    ? `${admin.name}님의 비밀번호를 ${Auth.DEFAULT_PASSWORD}으로 초기화했어요.`
                    : (errorText[result] || errorText.error), result === "ok");
            }

            function removeAdmin(admin) {
                if (!confirm(`${admin.name}(${admin.id})님의 관리자 권한을 없앨까요?\n해제하면 일반 학생으로 돌아가요.`)) return;
                const result = Auth.removeSubAdmin(admin.id);
                if (result === "ok" && editingId === admin.id) resetSubForm();
                renderSubAdmins();
                showMsg(listMsg, result === "ok"
                    ? `${admin.name}님의 관리자 권한을 없앴어요.`
                    : (errorText[result] || errorText.error), result === "ok");
            }

            function cell(text) {
                const td = document.createElement("td");
                td.textContent = text; // 입력값은 글자로만 넣어서 HTML이 실행되지 않게 함
                return td;
            }

            function actionButton(label, className, onClick) {
                const b = document.createElement("button");
                b.type = "button";
                b.className = className;
                b.style.margin = "0";
                b.textContent = label;
                b.addEventListener("click", onClick);
                return b;
            }

            function renderSubAdmins() {
                const list = Auth.listSubAdmins();

                rowsBody.innerHTML = "";
                emptyText.hidden = list.length > 0;
                tableWrap.hidden = list.length === 0;

                list.forEach(admin => {
                    const tr = document.createElement("tr");
                    tr.append(cell(admin.name), cell(admin.id), cell(admin.label));

                    const actions = document.createElement("td");
                    const box = document.createElement("div");
                    box.className = "row";
                    box.style.margin = "0";
                    box.append(
                        actionButton("수정", "secondary-button", () => startEdit(admin)),
                        actionButton(`비밀번호 ${Auth.DEFAULT_PASSWORD} 초기화`, "secondary-button", () => resetPassword(admin)),
                        actionButton("관리자 해제", "danger-button", () => removeAdmin(admin)));
                    actions.append(box);
                    tr.append(actions);

                    rowsBody.append(tr);
                });
            }

            renderSubAdmins();
        }

    </script>
</body>
</html>
