<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 관리 - 학생회</title>
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="admin-calendar.css">
</head>
<body>

    <div class="calendar">
        <div class="top-row">
            <a class="back-link" href="admin.html">← 관리자 페이지</a>
            <div id="userArea" class="user-area"></div>
        </div>

        <p id="modeNotice" class="mode-notice"></p>

        <div class="header">
            <button id="prev" aria-label="이전 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"/></svg></button>
            <h2 id="month"></h2>
            <button id="next" aria-label="다음 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"/></svg></button>
        </div>

        <div class="week">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div id="days" class="days"></div>
    </div>

    <!-- 날짜별 일정 관리 창: 그 날의 일정 목록 + 각 일정의 수정/삭제 + 일정 추가 버튼 -->
    <div id="popup" class="popup">
        <div class="popup-content">

            <button id="closePopup" class="close" aria-label="닫기">&times;</button>

            <h3 id="popupDate"></h3>

            <div id="scheduleList"></div>

            <button type="button" id="addScheduleButton" class="add-schedule-button">＋ 일정 추가</button>

        </div>
    </div>

    <!-- 일정 추가/수정 창 (새 창으로 떠요) -->
    <div id="editorPopup" class="popup">
        <div class="popup-content">

            <button id="closeEditor" class="close" aria-label="닫기">&times;</button>

            <form id="scheduleForm" class="schedule-form" autocomplete="off">
                <h4 id="formTitle">일정 추가</h4>

                <label for="titleInput">제목</label>
                <input type="text" id="titleInput" placeholder="일정 제목" maxlength="100">

                <label for="datetimeInput">일시</label>
                <input type="datetime-local" id="datetimeInput">

                <label for="placeInput">장소</label>
                <input type="text" id="placeInput" placeholder="장소" maxlength="100">

                <label for="contentInput">내용</label>
                <textarea id="contentInput" rows="4" placeholder="일정 내용" maxlength="1000"></textarea>

                <label for="linkInput">링크 (선택)</label>
                <input type="text" id="linkInput" placeholder="인스타 게시물 등 링크 (https://...)" maxlength="300" inputmode="url">

                <div class="form-buttons">
                    <button type="submit" id="saveSchedule">추가하기</button>
                    <button type="button" id="cancelEdit" class="cancel-button">취소</button>
                </div>
            </form>

        </div>
    </div>

    <script src="storage.js"></script>
    <script src="auth.js"></script>
    <script>
        // 이 페이지는 일정 관리용 (권한 없으면 메인으로)
        window.ADMIN_PAGE = true;
        if (!Auth.can("calendar.edit")) location.replace("index.html");
    </script>
    <script src="calendar.js"></script>
    <script>
        document.querySelector(".calendar").classList.add("admin-view");
    </script>
</body>
</html>
