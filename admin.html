<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 학생회</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="survey.css">
</head>
<body>

    <header class="site-header">
        <a class="logo" href="index.html">
            <span class="logo-mark">🎓</span>
            <span>학생회</span>
        </a>
        <div id="userArea" class="user-area"></div>
    </header>

    <main>
        <a class="login-back" href="index.html">← 메인으로</a>

        <h1 style="margin:0 0 12px;font-size:26px;font-weight:900">관리자 페이지</h1>

        <div class="admin-grid">

            <a class="menu-card" href="admin-calendar.html">
                <span class="menu-icon icon-calendar">📅</span>
                <span class="menu-text">
                    <h2>일정 관리</h2>
                    <p>일정을 추가·수정·삭제해요</p>
                </span>
                <span class="menu-arrow">›</span>
            </a>

            <a class="menu-card" href="admin-survey.html">
                <span class="menu-icon icon-vote">📝</span>
                <span class="menu-text">
                    <h2>설문조사 관리</h2>
                    <p>설문을 만들고, 결과를 보고, 삭제해요</p>
                </span>
                <span class="menu-arrow">›</span>
            </a>

            <!-- 부스 등 다른 기능은 합칠 때 위와 같은 menu-card를 여기에 추가하면 돼요 -->

            <section class="panel wide">
                <h2 style="margin:0 0 4px;font-size:19px">학년별 반 수 설정</h2>
                <p class="meta">여기서 정한 반 수는 설문 대상 선택과 학번 로그인 검사에 쓰여요. 각 반은 30명(1~30번)까지 유효한 학번으로 처리돼요.</p>

                <form id="classForm" autocomplete="off">
                    <label for="classCount1">1학년 반 수</label>
                    <input type="number" id="classCount1" min="1" max="20" inputmode="numeric">

                    <label for="classCount2">2학년 반 수</label>
                    <input type="number" id="classCount2" min="1" max="20" inputmode="numeric">

                    <label for="classCount3">3학년 반 수</label>
                    <input type="number" id="classCount3" min="1" max="20" inputmode="numeric">

                    <button type="submit" class="login-submit">반 수 저장</button>
                    <p id="classMsg" class="login-error" hidden></p>
                </form>
            </section>

            <section class="panel wide">
                <h2 style="margin:0 0 4px;font-size:19px">바로가기 링크 설정</h2>
                <p class="meta">메인 화면의 작은 버튼에 연결될 주소예요. 비워서 저장하면 링크가 지워져요.</p>

                <form id="linksForm" autocomplete="off">
                    <label for="schoolLink">학교 공식 사이트</label>
                    <input type="text" id="schoolLink" placeholder="https://..." maxlength="300" inputmode="url">

                    <label for="instagramLink">학생회 인스타그램</label>
                    <input type="text" id="instagramLink" placeholder="https://www.instagram.com/..." maxlength="300" inputmode="url">

                    <button type="submit" class="login-submit">링크 저장</button>
                    <p id="linksMsg" class="login-error" hidden></p>
                </form>
            </section>

            <section class="panel wide">
                <h2 style="margin:0 0 4px;font-size:19px">하위 관리자 지정</h2>
                <p class="meta">테스트 화면이에요. 지정해도 실제로 적용되지는 않아요.</p>

                <form id="subAdminForm" autocomplete="off">
                    <label for="subAdminId">학번</label>
                    <input type="text" id="subAdminId" inputmode="numeric" maxlength="5" placeholder="5자리 학번">

                    <label>역할</label>
                    <label class="option"><input type="checkbox"> 학생회 임원</label>
                    <label class="option"><input type="checkbox"> 동아리 부장</label>

                    <button type="submit" class="login-submit">지정하기</button>
                    <p id="subAdminMsg" class="login-error" hidden></p>
                </form>
            </section>

        </div>
    </main>

    <footer class="site-footer">© 학생회</footer>

    <script src="auth.js"></script>
    <script>
        // 관리자가 아니면 메인으로 돌려보냄
        if (!Auth.can("admin.manage")) {
            location.replace("index.html");
        }

        Auth.renderUserArea(document.getElementById("userArea"));

        // ---------- 학년별 반 수 ----------

        const classMsg = document.getElementById("classMsg");
        const classInputs = { 1: document.getElementById("classCount1"), 2: document.getElementById("classCount2"), 3: document.getElementById("classCount3") };

        function fillClassInputs() {
            const counts = Auth.getClassCount();
            for (const g of [1, 2, 3]) classInputs[g].value = counts[g];
        }
        fillClassInputs();

        function showClassMsg(text, ok) {
            classMsg.textContent = text;
            classMsg.style.background = ok ? "#e6f7ee" : "";
            classMsg.style.color = ok ? "#1f7a4a" : "";
            classMsg.hidden = false;
        }

        document.getElementById("classForm").addEventListener("submit", event => {
            event.preventDefault();

            const result = Auth.setClassCount({ 1: classInputs[1].value, 2: classInputs[2].value, 3: classInputs[3].value });

            if (result === "ok") showClassMsg("저장했어요. 설문 대상 선택과 학번 검사에 바로 반영돼요.", true);
            else if (result === "invalid") showClassMsg(`반 수는 1~${Auth.MAX_CLASS} 사이의 정수로 입력해 주세요.`, false);
            else if (result === "forbidden") showClassMsg("권한이 없어요.", false);
            else showClassMsg("이 브라우저에서는 저장할 수 없어요.", false);

            if (result !== "ok") fillClassInputs();
        });

        // ---------- 바로가기 링크 ----------

        const schoolInput = document.getElementById("schoolLink");
        const instagramInput = document.getElementById("instagramLink");
        const linksMsg = document.getElementById("linksMsg");

        // http / https 주소만 허용. 비어 있으면 "", 올바르지 않으면 null
        function normalizeLink(value) {
            const text = String(value ?? "").trim();
            if (text === "") return "";

            const withScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(text) ? text : `https://${text}`;

            try {
                const url = new URL(withScheme);
                return (url.protocol === "https:" || url.protocol === "http:") ? url.href : null;
            } catch (error) {
                return null;
            }
        }

        function showLinksMsg(text, ok) {
            linksMsg.textContent = text;
            linksMsg.style.background = ok ? "#e6f7ee" : "";
            linksMsg.style.color = ok ? "#1f7a4a" : "";
            linksMsg.hidden = false;
        }

        let savedLinks = {};
        try { savedLinks = JSON.parse(localStorage.getItem("siteLinks")) || {}; } catch (error) { savedLinks = {}; }

        schoolInput.value = savedLinks.school || "";
        instagramInput.value = savedLinks.instagram || "";

        document.getElementById("linksForm").addEventListener("submit", event => {
            event.preventDefault();

            if (!Auth.can("admin.manage")) return;

            const school = normalizeLink(schoolInput.value);
            const instagram = normalizeLink(instagramInput.value);

            if (school === null || instagram === null) {
                showLinksMsg("https://로 시작하는 올바른 주소를 입력해 주세요.", false);
                return;
            }

            localStorage.setItem("siteLinks", JSON.stringify({ school, instagram }));
            schoolInput.value = school;
            instagramInput.value = instagram;
            showLinksMsg("저장했어요. 메인 화면 버튼에 바로 반영돼요.", true);
        });

        // ---------- 하위 관리자 (테스트 화면) ----------

        document.getElementById("subAdminForm").addEventListener("submit", event => {
            event.preventDefault();

            const id = document.getElementById("subAdminId").value.trim();
            const msg = document.getElementById("subAdminMsg");

            msg.textContent = Auth.isValidId(id)
                ? "테스트 버전이라 실제로 적용되지 않아요."
                : "학번은 5자리 숫자로 입력해 주세요.";
            msg.hidden = false;
        });
    </script>
</body>
</html>
