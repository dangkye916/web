
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설문조사 - 학생회</title><link rel="stylesheet" href="main.css"><link rel="stylesheet" href="feature.css">
</head>
<body>
  <header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">🎓</span><span>학생회</span></a><div id="userArea" class="user-area"></div></header>
  <main class="feature-main">
    <div class="page-top"><a href="index.html">← 메인으로</a><span id="adminLink"></span></div>
    <section class="feature-hero"><p class="eyebrow">STUDENT VOICE</p><h1>설문조사</h1><p>학교생활에 관한 의견을 들려줘.</p></section>
    <section id="adminPanel" class="panel" hidden>
      <h2>관리자 · 설문 관리</h2>
      <p class="muted">설문을 임시 저장한 뒤 미리보기하고 게시할 수 있어. 게시 후에는 질문과 선택지를 수정하거나 삭제할 수 없어.</p>
      <form id="surveyForm" class="stack">
        <label for="surveyTitle">설문 제목</label><input id="surveyTitle" required maxlength="120" placeholder="예: 축제 체험 부스 선호도 조사">
        <label for="surveyDescription">설문 안내 (선택)</label><textarea id="surveyDescription" rows="2" maxlength="500" placeholder="설문 목적이나 안내 사항"></textarea>
        <div class="two-cols"><div><label for="audience">참여 대상</label><select id="audience"><option value="all">전체 학생</option><option value="grade">특정 학년</option><option value="class">특정 학급</option></select></div><div id="gradeWrap" hidden><label for="targetGrade">학년</label><select id="targetGrade"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></div><div id="classWrap" hidden><label for="targetClass">반</label><input id="targetClass" inputmode="numeric" maxlength="2" placeholder="예: 01"></div></div>
        <div class="two-cols"><div><label for="startAt">시작 일시</label><input id="startAt" type="datetime-local" required></div><div><label for="endAt">마감 일시</label><input id="endAt" type="datetime-local" required></div></div>
        <label class="check-row"><input type="checkbox" id="namedSurvey"> 익명 설문이 아닌 실명 설문으로 진행 (학번·이름 수집 안내가 필요해)</label>
        <div class="section-heading"><h3>질문 구성</h3><button type="button" id="addQuestion" class="secondary-button">＋ 질문 추가</button></div>
        <div id="questionBuilder" class="stack"></div>
        <div class="button-row"><button type="button" id="previewSurvey" class="secondary-button">미리보기</button><button type="button" id="saveDraft" class="secondary-button">임시 저장</button><button type="submit" class="primary-button">게시하기</button></div>
        <p id="builderMessage" class="message" role="status"></p>
      </form>
    </section>
    <section id="surveyListPanel" class="panel"><div class="section-heading"><h2>참여 가능한 설문</h2><span id="surveyCount" class="count-label"></span></div><div id="surveyList" class="survey-list"></div></section>
    <section id="resultsPanel" class="panel" hidden><div class="section-heading"><h2 id="resultsTitle">설문 결과</h2><button type="button" id="closeResults" class="secondary-button">목록으로</button></div><div id="resultsContent"></div></section>
    <section id="previewPanel" class="panel" hidden><div class="section-heading"><h2>설문 미리보기</h2><button type="button" id="closePreview" class="secondary-button">닫기</button></div><div id="previewContent"></div></section>
    <p class="notice">테스트 버전: 데이터는 현재 브라우저의 localStorage에 저장돼. 다른 기기와 자동으로 공유되지 않으며, 실제 운영에서 보안·익명성을 보장하려면 서버와 데이터베이스 권한 설정이 필요해.</p>
  </main>
  <script src="auth.js"></script><script src="survey.js"></script>
</body></html>
