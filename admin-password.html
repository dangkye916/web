<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 비밀번호 변경 - 학생회</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="survey.css">
</head>
<body>

    <header class="site-header">
        <a class="logo" href="index.html">
            <span class="logo-mark">🎓</span>
            <span>학생회</span>
        </a>
        <div id="userArea" class="user-area"></div>
    </header>

    <main>
        <a class="login-back" href="admin.html">← 관리자 페이지</a>

        <section class="panel">
            <h1>내 비밀번호 변경</h1>
            <p class="meta">현재 비밀번호를 입력한 뒤 새 비밀번호를 정해 주세요. (4~30자, 0000은 사용할 수 없어요)</p>
            <p id="superNote" class="meta" hidden>
                ⚠️ 서버를 연결하기 전까지는 바꾼 비밀번호가 이 브라우저에만 적용돼요.
                다른 기기에서는 <b>auth.js에 적힌 옛 비밀번호</b>가 그대로 통하니, 사이트를 배포하기 전에 코드의 비밀번호도 꼭 바꿔 주세요.
            </p>

            <form id="passwordForm" autocomplete="off" style="max-width:420px">
                <label for="oldPassword">현재 비밀번호</label>
                <input type="password" id="oldPassword" autocomplete="current-password">

                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" autocomplete="new-password" maxlength="30">

                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="30">

                <button type="submit" class="login-submit">비밀번호 변경</button>
                <p id="passwordMsg" class="login-error" hidden></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">© 학생회</footer>

    <script src="storage.js"></script>
    <script type="after-ready" src="auth.js"></script>
    <script type="after-ready" src="admin.js"></script>
    <script type="after-ready">
        // 관리자라면 누구나 (최고 관리자·하위 관리자) 자기 비밀번호를 바꿀 수 있어요
        if (AdminPage.guard(null)) {
            Auth.renderUserArea(document.getElementById("userArea"));

            const user = Auth.getUser();
            if (user && user.role === "super") document.getElementById("superNote").hidden = false;

            const form = document.getElementById("passwordForm");
            const msg = document.getElementById("passwordMsg");
            const oldInput = document.getElementById("oldPassword");
            const newInput = document.getElementById("newPassword");
            const confirmInput = document.getElementById("confirmPassword");

            const errorText = {
                wrong: "현재 비밀번호가 맞지 않아요.",
                too_short: `새 비밀번호는 ${Auth.MIN_PASSWORD}자 이상으로 입력해 주세요.`,
                too_long: `새 비밀번호는 ${Auth.MAX_PASSWORD}자 이하로 입력해 주세요.`,
                default: `${Auth.DEFAULT_PASSWORD}은 새 비밀번호로 쓸 수 없어요.`,
                same: "현재 비밀번호와 다른 비밀번호를 입력해 주세요.",
                mismatch: "새 비밀번호 확인이 일치하지 않아요.",
                not_admin: "관리자만 바꿀 수 있어요. 다시 로그인해 주세요.",
                error: "이 브라우저에서는 저장할 수 없어요."
            };

            form.addEventListener("submit", event => {
                event.preventDefault();

                const result = Auth.changePassword(oldInput.value, newInput.value, confirmInput.value);

                if (result === "ok") {
                    form.reset();
                    AdminPage.showMsg(msg, "비밀번호를 바꿨어요. 다음 로그인부터 새 비밀번호를 사용해 주세요.", true);
                    return;
                }

                AdminPage.showMsg(msg, errorText[result] || errorText.error, false);
                if (result === "wrong") oldInput.select();
            });
        }

    </script>
</body>
</html>
