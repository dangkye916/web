<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calendar">

        <div class="header">
            <button id="prev">‹</button>
            <h2 id="month"></h2>
            <button id="next">›</button>
        </div>

        <div class="week">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div id="days" class="days"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
