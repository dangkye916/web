<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar">

        <div class="header">
            <button id="prev">‹</button>
            <h2 id="month"></h2>
            <button id="next">›</button>
        </div>

        <div class="week">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div id="days" class="days"></div>

    </div>


    <!-- 일정 입력 팝업 -->
    <div id="popup" class="popup">

        <div class="popup-content">

            <span id="closePopup" class="close">&times;</span>

            <h3 id="popupDate"></h3>

            <input
                type="text"
                id="scheduleInput"
                placeholder="일정을 입력하세요"
            >
            
            <div class="button-group">
                <button id="saveSchedule">저장</button>
                <button id="deleteSchedule">삭제</button>
            </div>
        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
