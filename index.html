
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생회 웹사이트</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="main-additions.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-mark">🎓</span>
      <span>학생회</span>
    </a>
    <div id="userArea" class="user-area"></div>
  </header>

  <main>
    <section class="hero">
      <h1>학생회 웹사이트에 오신 것을 환영합니다</h1>
      <p>학교생활에 필요한 일정과 소식을 한곳에서 확인해 봐.</p>
    </section>

    <nav class="menu" aria-label="주요 메뉴">
      <a class="menu-card" href="calendar.html">
        <span class="menu-icon icon-calendar">📅</span>
        <span class="menu-text">
          <h2>캘린더</h2>
          <p>학생회 일정을 확인하고 즐겨찾기해.</p>
        </span>
        <span class="menu-arrow">›</span>
      </a>

      <!-- 다른 친구들이 만드는 교칙·부스 코드는 건드리지 않음 -->
      <div class="menu-card disabled" aria-disabled="true">
        <span class="menu-icon icon-rules">📖</span>
        <span class="menu-text">
          <h2>학교 규정 정리</h2>
          <p>학교 규정을 한눈에 확인해.</p>
        </span>
        <span class="badge">준비 중</span>
      </div>

      <div class="menu-card disabled" aria-disabled="true">
        <span class="menu-icon icon-booth">🎪</span>
        <span class="menu-text">
          <h2>축제 부스 예약</h2>
          <p>축제 부스 예약을 확인해.</p>
        </span>
        <span class="badge">준비 중</span>
      </div>

      <a class="menu-card" href="survey.html">
        <span class="menu-icon icon-vote">📋</span>
        <span class="menu-text">
          <h2>설문조사</h2>
          <p>진행 중인 설문에 참여해.</p>
        </span>
        <span class="menu-arrow">›</span>
      </a>
    </nav>

    <section class="favorites" aria-labelledby="favoritesTitle">
      <h2 id="favoritesTitle">⭐ 즐겨찾기한 일정</h2>
      <ul id="favoriteList" class="favorite-list"></ul>
      <p id="favoriteEmpty" class="favorite-empty" hidden></p>
    </section>

    <section class="external-links" id="externalLinks" hidden>
      <a class="external-link" id="instagramLink"
         target="_blank" rel="noopener noreferrer" hidden>
        <span>◎</span> 학생회 인스타그램 ↗
      </a>
      <a class="external-link" id="schoolLink"
         target="_blank" rel="noopener noreferrer" hidden>
        <span>⌂</span> 학교 공식 사이트 ↗
      </a>
    </section>

    <div id="adminShortcut" hidden>
      <a class="admin-shortcut" href="admin.html">⚙ 관리자 대시보드</a>
    </div>
  </main>

  <footer class="site-footer">© 학생회 · 함께 만드는 학교생활</footer>

  <script src="auth.js"></script>
  <script>
    Auth.renderUserArea(document.getElementById("userArea"));

    const user = Auth.getUser();
    document.getElementById("adminShortcut").hidden = !user?.isAdmin;

    const links = JSON.parse(
      localStorage.getItem("councilExternalLinks") ||
      '{"instagram":"","school":""}'
    );

    function setExternalLink(id, value) {
      const element = document.getElementById(id);
      if (!value) return;
      try {
        const url = new URL(value);
        if (!["https:", "http:"].includes(url.protocol)) return;
        element.href = url.href;
        element.hidden = false;
        document.getElementById("externalLinks").hidden = false;
      } catch {}
    }

    setExternalLink("instagramLink", links.instagram);
    setExternalLink("schoolLink", links.school);

    function pad(n) { return String(n).padStart(2, "0"); }

    function renderFavorites() {
      const list = document.getElementById("favoriteList");
      const empty = document.getElementById("favoriteEmpty");
      list.replaceChildren();
      empty.hidden = true;

      if (!user) {
        empty.textContent = "로그인하면 즐겨찾기한 일정을 볼 수 있어.";
        empty.hidden = false;
        return;
      }

      let favoriteIds = [];
      let schedules = {};

      try {
        favoriteIds = JSON.parse(
          localStorage.getItem(`favoriteIds_${user.id}`) || "[]"
        );
        schedules = JSON.parse(
          localStorage.getItem("schedules") || "{}"
        );
      } catch {}

      const now = new Date();
      const today =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
      const items = [];

      for (const dateKey in schedules) {
        if (!Array.isArray(schedules[dateKey])) continue;

        schedules[dateKey].forEach(item => {
          if (!item || !favoriteIds.includes(item.id)) return;

          const datetime = item.datetime || dateKey;
          const date = datetime.slice(0, 10);
          if (date < today) return;

          items.push({
            date,
            datetime,
            title: item.title || item.text || ""
          });
        });
      }

      items.sort((a,b) => a.datetime.localeCompare(b.datetime));

      if (!items.length) {
        empty.textContent = "즐겨찾기한 일정이 없어.";
        empty.hidden = false;
        return;
      }

      items.forEach(item => {
        const li = document.createElement("li");
        li.className = "favorite-item";

        const date = document.createElement("span");
        date.className = "favorite-date";
        date.textContent = item.date;

        const title = document.createElement("span");
        title.className = "favorite-title";
        title.textContent = item.title;

        li.append(date, title);
        list.append(li);
      });
    }

    renderFavorites();
  </script>
</body>
</html>
