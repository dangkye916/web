
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생회 캘린더</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calendar">
        <div class="header">
            <button id="prev" aria-label="이전 달">‹</button>
            <h2 id="month"></h2>
            <button id="next" aria-label="다음 달">›</button>
        </div>

        <div class="week">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div id="days" class="days"></div>
    </div>

    <!-- 날짜별 일정 팝업 -->
    <div id="popup" class="popup">
        <div class="popup-content">

            <button id="closePopup" class="close"
                aria-label="닫기">&times;</button>

            <h3 id="popupDate"></h3>

            <!-- 일정 목록 -->
            <div id="scheduleList"></div>

            <!-- 새 일정 추가 -->
            <input
                type="text"
                id="scheduleInput"
                placeholder="새 일정을 입력하세요"
                maxlength="200"
            >

            <button id="saveSchedule">일정 추가</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
