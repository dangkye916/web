<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 학생회</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="login-page">

    <header class="site-header">
        <a class="logo" href="main.html">
            <span class="logo-mark">🎓</span>
            <span>학생회</span>
        </a>
    </header>

    <div class="login-main">
        <section class="login-card">

            <div class="login-banner">
                <div class="login-emoji">🔑</div>
                <h1>로그인</h1>
                <p>학번으로 간편하게 시작해요</p>
            </div>

            <div class="login-body">

                <!-- 로그인 전 -->
                <div id="loginView">
                    <p class="login-desc">내 학번은 이렇게 만들어요</p>

                    <div class="id-guide" aria-label="학번 구성 예시">
                        <span><b>1</b>학년</span>
                        <span><b>01</b>반</span>
                        <span><b>01</b>번</span>
                        <span class="eq">=</span>
                        <span class="result"><b>10101</b>학번</span>
                    </div>

                    <form id="loginForm" autocomplete="off">
                        <label for="studentId">학번 5자리</label>
                        <input
                            type="text"
                            id="studentId"
                            inputmode="numeric"
                            maxlength="5"
                            placeholder="•••••"
                        >

                        <!-- 관리자 학번이면 login.js가 비밀번호 칸을 여기에 넣어 줘요 -->

                        <p id="loginError" class="login-error" hidden></p>

                        <button type="submit" class="login-submit">로그인</button>
                    </form>
                </div>

                <!-- 이미 로그인한 상태 -->
                <div id="loggedInView" hidden>
                    <p class="login-desc" id="loggedInText"></p>

                    <div class="login-actions">
                        <a class="home-button" href="main.html">메인으로</a>
                        <button type="button" id="logoutButton" class="secondary-button">로그아웃</button>
                    </div>
                </div>

            </div>

        </section>

        <a class="login-back" href="main.html">← 메인으로 돌아가기</a>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
