<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 학생회</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <header class="site-header">
        <a class="logo" href="index.html">
            <span class="logo-mark">🎓</span>
            <span>학생회</span>
        </a>
    </header>

    <div class="login-main">
        <section class="login-card">

            <div class="big-icon">🔑</div>
            <h1>로그인</h1>

            <!-- 로그인 전 -->
            <div id="loginView">
                <p class="login-desc">학번을 입력하면 로그인돼요.</p>

                <form id="loginForm" autocomplete="off">
                    <label for="studentId">학번</label>
                    <input
                        type="text"
                        id="studentId"
                        inputmode="numeric"
                        maxlength="10"
                        placeholder="학번을 입력하세요"
                    >

                    <p id="loginError" class="login-error" hidden></p>

                    <button type="submit" class="login-submit">로그인</button>
                </form>
            </div>

            <!-- 이미 로그인한 상태 -->
            <div id="loggedInView" hidden>
                <p class="login-desc" id="loggedInText"></p>

                <div class="login-actions">
                    <a class="home-button" href="index.html">메인으로</a>
                    <button type="button" id="logoutButton" class="secondary-button">로그아웃</button>
                </div>
            </div>

        </section>
    </div>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
