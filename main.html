<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생회 웹사이트</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin: -12px 0 24px; }
        .quick-link {
            padding: 8px 14px; border: none; border-radius: 999px; background: white;
            color: var(--primary-dark); font: inherit; font-size: 13px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 12px rgba(79, 140, 247, 0.18);
            transition: background-color 0.15s, color 0.15s, transform 0.15s;
        }
        .quick-link:hover { background: var(--primary); color: white; transform: translateY(-1px); }
    </style>
</head>
<body>

    <header class="site-header">
        <a class="logo" href="main.html">
            <span class="logo-mark">🎓</span>
            <span>학생회</span>
        </a>

        <!-- 로그인 버튼 / 학번 + 로그아웃 (auth.js가 채워 줘요) -->
        <div id="userArea" class="user-area"></div>
    </header>

    <main>
        <section class="hero">
            <h1>학생회 웹사이트에 오신 것을 환영합니다</h1>
            <p>일정 확인부터 학교 규정, 축제 부스 예약, 설문조사까지<br>한 곳에서 편하게 이용해 보세요.</p>
        </section>

        <!-- 바로가기 (링크는 최고 관리자가 관리자 페이지에서 설정) -->
        <div class="quick-links" aria-label="바로가기">
            <button type="button" class="quick-link" data-key="school">🏫 학교 공식 사이트</button>
            <button type="button" class="quick-link" data-key="instagram">📷 학생회 인스타그램</button>
        </div>

        <nav class="menu" aria-label="주요 메뉴">

            <!-- 캘린더: 연결됨 -->
            <a class="menu-card" href="calendar.html">
                <span class="menu-icon icon-calendar">📅</span>
                <span class="menu-text">
                    <h2>캘린더</h2>
                    <p>학생회 일정을 확인하고 추가해요</p>
                </span>
                <span class="menu-arrow">›</span>
            </a>

            <!-- 아래 기능들은 페이지가 만들어지면 <div>를 <a href="...">로 바꾸고
                 disabled 클래스와 badge를 빼면 돼요 -->
            <div class="menu-card disabled" aria-disabled="true">
                <span class="menu-icon icon-rules">📖</span>
                <span class="menu-text">
                    <h2>학교 규정 정리</h2>
                    <p>학교 규정을 한눈에 찾아봐요</p>
                </span>
                <span class="badge">준비 중</span>
            </div>

            <div class="menu-card disabled" aria-disabled="true">
                <span class="menu-icon icon-booth">🎪</span>
                <span class="menu-text">
                    <h2>축제 부스 예약</h2>
                    <p>축제 부스를 신청하고 예약해요</p>
                </span>
                <span class="badge">준비 중</span>
            </div>

            <!-- 설문조사: 연결됨 (예전 "투표") -->
            <a class="menu-card" href="survey.html">
                <span class="menu-icon icon-vote">🗳️</span>
                <span class="menu-text">
                    <h2>설문조사</h2>
                    <p>진행 중인 설문에 참여해요</p>
                </span>
                <span class="menu-arrow">›</span>
            </a>

        </nav>

        <!-- 즐겨찾기한 일정 (지나간 일정은 제외, 날짜순) -->
        <section class="favorites" aria-labelledby="favoritesTitle">
            <h2 id="favoritesTitle">⭐ 즐겨찾기한 일정</h2>
            <ul id="favoriteList" class="favorite-list"></ul>
            <p id="favoriteEmpty" class="favorite-empty" hidden></p>
        </section>
    </main>

    <footer class="site-footer">
        © 학생회
    </footer>

    <script src="auth.js"></script>
    <script>
        Auth.renderUserArea(document.getElementById("userArea"));

        // ---------- 즐겨찾기한 일정 ----------

        function pad(number) {
            return String(number).padStart(2, "0");
        }

        function renderFavorites() {

            const list = document.getElementById("favoriteList");
            const empty = document.getElementById("favoriteEmpty");

            list.innerHTML = "";
            empty.hidden = true;

            const user = Auth.getUser();

            // 로그인 안 했으면 안내만 표시
            if (!user) {
                empty.textContent = "로그인하면 즐겨찾기한 일정을 볼 수 있어요.";
                empty.hidden = false;
                return;
            }

            // 내 즐겨찾기 ID 목록 (calendar 페이지에서 저장한 값)
            let favoriteIds = [];

            try {
                const saved = JSON.parse(
                    localStorage.getItem(`favoriteIds_${user.id}`)
                );

                if (Array.isArray(saved)) {
                    favoriteIds = saved;
                }
            } catch (error) {
                // 값이 깨졌으면 빈 목록으로 처리
            }

            const favoriteSet = new Set(favoriteIds);

            // 전체 일정
            let schedules = {};

            try {
                schedules = JSON.parse(localStorage.getItem("schedules")) || {};
            } catch (error) {
                schedules = {};
            }

            // 오늘 날짜 (YYYY-MM-DD)
            const now = new Date();
            const todayKey =
                `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

            const items = [];

            for (const dateKey in schedules) {

                const dayList = schedules[dateKey];

                if (!Array.isArray(dayList)) {
                    continue;
                }

                dayList.forEach(item => {

                    if (!item || typeof item !== "object" || !favoriteSet.has(item.id)) {
                        return;
                    }

                    const datetime = item.datetime || dateKey;
                    const date = datetime.slice(0, 10);

                    // 지나간 일정(어제까지)은 표시하지 않음 — 오늘 일정은 표시
                    if (date < todayKey) {
                        return;
                    }

                    items.push({
                        datetime: datetime,
                        date: date,
                        title: item.title ?? item.text ?? ""
                    });
                });
            }

            if (items.length === 0) {
                empty.textContent = "즐겨찾기한 일정이 없습니다.";
                empty.hidden = false;
                return;
            }

            // 날짜순 정렬
            items.sort((a, b) => a.datetime.localeCompare(b.datetime));

            items.forEach(item => {

                const [year, month, day] = item.date.split("-");

                // 올해가 아니면 연도도 같이 표시
                const dateText =
                    (Number(year) !== now.getFullYear() ? `${year}년 ` : "") +
                    `${Number(month)}월 ${Number(day)}일`;

                const row = document.createElement("li");
                row.className = "favorite-item";

                const dateElement = document.createElement("span");
                dateElement.className = "favorite-date";
                dateElement.textContent = dateText;

                const titleElement = document.createElement("span");
                titleElement.className = "favorite-title";
                titleElement.textContent = item.title;

                row.appendChild(dateElement);
                row.appendChild(titleElement);

                list.appendChild(row);
            });
        }

        renderFavorites();

        // ---------- 바로가기 버튼 ----------
        document.querySelectorAll(".quick-link").forEach(button => {
            button.addEventListener("click", () => {
                let links = {};
                try { links = JSON.parse(localStorage.getItem("siteLinks")) || {}; } catch (error) { links = {}; }

                const url = links[button.dataset.key];

                if (!url || !/^https?:\/\//i.test(url)) {
                    alert("아직 링크가 등록되지 않았어요.");
                    return;
                }

                window.open(url, "_blank", "noopener,noreferrer");
            });
        });
    </script>
</body>
</html>
